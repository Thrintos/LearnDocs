# ─────────────────────────────────────────────
#  Site Information
# ─────────────────────────────────────────────
site_name: "Microsoft Security Study Notes"
site_url: "https://microsoft-security-study-notes.github.io/"
site_description: "A comprehensive collection of study notes and resources for Microsoft Security certifications, including SC-900, SC-200 and SC-300."
site_author: "Daan van der Kruit"
repo_url: "https://github.com/Thrintos/LearnDocs"
edit_uri: /edit/main/docs/
repo_name: "GitHub"
copyright: "&copy; 2026 — Study resource, not affiliated with Microsoft."

# ─────────────────────────────────────────────
# Theme - Material
# ─────────────────────────────────────────────
theme:
  name: material
  icon:
    logo: material/shield-lock
    repo: fontawesome/brands/github

  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.tabs           # Top-level tabs per certification
    - navigation.sections       # Grouped sections in the sidebar
    - navigation.top            # Back-to-top button
    - navigation.footer         # Previous / Next page links
    - navigation.indexes        # Allow section index pages
    - search.highlight          # Highlight search terms on page
    - search.suggest            # Autocomplete in search bar
    - content.code.copy         # Copy button on code blocks
    - content.tooltips          # Hover tooltips

# ─────────────────────────────────────────────
#  Navigation
# ─────────────────────────────────────────────
nav:
  - Home: index.md

  - SC-900 Fundamentals:
      - SC-900/index.md
      - Module 1 - Security Concepts: "SC-900/sc-900-security-concepts.md"
      - Module 2 - Identity and Access: "SC-900/sc-900-identity-and-access.md"
      - Module 3 - Security Solutions: "SC-900/sc-900-security-solutions.md"
      - Module 4 - Compliance Solutions: "SC-900/sc-900-compliance-solutions.md"
      - Glossary: "SC-900/sc-900-glossary.md"
      - Practice Questions: "SC-900/sc-900-practice-questions.md"

# ─────────────────────────────────────────────
#  Markdown Extensions
# ─────────────────────────────────────────────
markdown_extensions: 
  - admonition                  # Note / Warning / Tip callout boxes
  - pymdownx.details            # Collapsible sections
  - pymdownx.superfences        # Code blocks inside admonitions etc.
  - pymdownx.highlight:  
      anchor_linenums: true
  - pymdownx.inlinehilite       # Inline code highlighting
  - pymdownx.tabbed:
      alternate_style: true     # Tabbed content blocks
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true           # Anchor links on headings

# ─────────────────────────────────────────────
#  Plugins
# ─────────────────────────────────────────────
plugins: 
  - search:
      lang: en